name: Deploy NextEval Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the allowlisted site and verify the pinned results
        run: node test/results.mjs
      - name: Verify Pareto coverage, plan cleanup and model names
        run: |
          node test/primary-pareto-coverage.mjs
          node test/active-plan-cleanup.mjs
          node test/model-identities.mjs
      - name: Verify links to NextEval repositories are public
        run: node test/public-links.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
